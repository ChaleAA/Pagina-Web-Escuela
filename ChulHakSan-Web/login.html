    <!-- Script to handle Database and Auth Logic -->
    <script src="database.js"></script>
    <script>
        // Simulando una base de datos usando LocalStorage
        const DB_KEY = 'chulhaksan_users_db';

        // Inicializar DB si no existe
        function initDB() {
            if (!localStorage.getItem(DB_KEY)) {
                const initialUsers = window.simulatedDatabase || [
                    { id: 'admin', password: 'admin', role: 'admin' },
                    { id: 'alumno', password: '123', role: 'student' }
                ];
                localStorage.setItem(DB_KEY, JSON.stringify(initialUsers));
            }
        }
        initDB();

        function getUsers() {
            return JSON.parse(localStorage.getItem(DB_KEY)) || [];
        }

        function saveUsers(users) {
            localStorage.setItem(DB_KEY, JSON.stringify(users));
        }

        function showAlert(message, isError = true) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = message;
            alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');

            if (isError) {
                alertBox.classList.add('bg-red-100', 'text-red-800');
            } else {
                alertBox.classList.add('bg-green-100', 'text-green-800');
            }

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4000);
        }

        function toggleView(view) {
            if (view === 'login') {
                document.getElementById('login-container').classList.remove('hidden');
                document.getElementById('login-container').classList.add('block');
                document.getElementById('register-container').classList.add('hidden');
                document.getElementById('register-container').classList.remove('block');
            } else {
                document.getElementById('register-container').classList.remove('hidden');
                document.getElementById('register-container').classList.add('block');
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('login-container').classList.remove('block');
            }
        }

        // Lógica de Registro
        document.getElementById('register-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const lastname = document.getElementById('reg-lastname').value.trim();
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            if (!name || !lastname || !password) return;
            
            const id = `${name} ${lastname}`;

            const users = getUsers();
            const exists = users.find(u => u.id.toLowerCase() === id.toLowerCase());

            if (exists) {
                showAlert('Ese nombre y apellido ya existen. Por favor elige otro o inicia sesión.', true);
                return;
            }

            users.push({ id, password, role });
            saveUsers(users);

            showAlert('Access created successfully! You can now log in.', false);
            toggleView('login');
            this.reset();
        });

        // Lógica de Login
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-password').value;

            const users = getUsers();
            const user = users.find(u => u.id.toLowerCase() === id.toLowerCase());

            if (!user) {
                showAlert("Account not found. You don't have an account, please register first.", true);
                return;
            }

            if (user.password !== password) {
                showAlert('Incorrect password. Please try again.', true);
                return;
            }

            // Exito: Guardamos el usuario activo y redirigimos segun su rol o lo mandamos a index
            localStorage.setItem('active_user', JSON.stringify(user));

            if (user.role === 'admin') {
                window.location.href = 'admin.html';
            } else if (user.role === 'instructor') {
                window.location.href = 'instructor.html';
            } else if (user.role === 'student') {
                window.location.href = 'student.html';
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
